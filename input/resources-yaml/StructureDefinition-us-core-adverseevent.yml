resourceType: StructureDefinition
id: us-core-adverseevent
url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-adverseevent
version: 8.0.0-ballot
name: USCoreAdverseEventProfile
title: US Core AdverseEvent Profile
status: active
experimental: false
date: '2026-08-11'
publisher: HL7 International / Cross-Group Projects
contact:
  - name: HL7 International / Cross-Group Projects
    telecom:
      - system: url
        value: http://www.hl7.org/Special/committees/cgp
      - system: email
        value: cgp@lists.HL7.org
description: >-
  The US Core AdverseEvent Profile inherits from the FHIR
  [AdverseEvent](https://hl7.org/fhir/R4/adverseevent.html) resource; refer to it
  for scope and usage definitions. This profile meets the requirements of the
  U.S. Core Data for Interoperability (USCDI) *Adverse Events Data Class* and its
  *Adverse Event* and *Adverse Event Outcome* Data Elements. It sets minimum
  expectations for the AdverseEvent resource to record, search, and fetch
  information about a change to patient condition that could be an unintended
  effect of clinical interventions. It specifies which core elements, extensions,
  vocabularies, and value sets **SHALL** be present in the resource and
  constrains how the elements are used. Providing the floor for standards
  development for specific use cases promotes interoperability and adoption.
jurisdiction:
