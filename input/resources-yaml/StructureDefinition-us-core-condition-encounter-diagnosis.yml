    - id: Condition.category
      path: Condition.category
      slicing:
        discriminator:
          - type: value
            path: $this
        rules: open
      short: category codes
      min: 1
      mustSupport: true
    - id: Condition.category:us-core
      path: Condition.category
      sliceName: us-core
      short: encounter-diagnosis
      min: 1
      max: '1'
      patternCodeableConcept:
        coding:
          - system: http://terminology.hl7.org/CodeSystem/condition-category
            code: encounter-diagnosis
      mustSupport: true
    - id: Condition.code
      path: Condition.code
      min: 1
      mustSupport: true
# ====== New R5 additional Binding Element removed in v9 ====
      binding:
        strength: extensible
        description: Valueset to describe the actual problem experienced by the patient
        valueSet: http://hl7.org/fhir/us/core/ValueSet/us-core-condition-code
    - id: Condition.subject
      path: Condition.subject
      type:
        - code: Reference
          targetProfile:
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-patient
            - http://hl7.org/fhir/StructureDefinition/Group
          _targetProfile:
            - extension:
                - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
                  valueBoolean: true
            - extension:
                - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
                  valueBoolean: false
      mustSupport: true
    - id: Condition.encounter
      path: Condition.encounter
      type:
        - code: Reference
          targetProfile:
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-encounter
      mustSupport: true
 #========= removed in US Core 8 =======================
