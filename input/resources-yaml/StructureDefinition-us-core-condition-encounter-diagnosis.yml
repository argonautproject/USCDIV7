title: US Core Condition Encounter Diagnosis Profile
status: active
experimental: false
date: 2023-10-17
description: '***Testing evidence detail element***'
kind: resource
abstract: false
type: Condition
baseDefinition: http://hl7.org/fhir/StructureDefinition/Condition
derivation: constraint
differential:
  element:
    - id: Condition
      path: Condition
      mustSupport: false

  #========= removed in US Core 8 =======================
