  2002+ International Health Terminology Standards Development
  Organisation (IHTSDO), and distributed by agreement between IHTSDO and
  HL7. Implementer use of SNOMED CT is not covered by this agreement.
compose:
  inactive: true
  include:
    - system: http://snomed.info/sct
      filter:
        - property: concept
          op: is-a
          value: '17636008'
    - system: http://snomed.info/sct
