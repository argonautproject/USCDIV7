name: USCoreSpecimenCollectionMethod
title: US Core Specimen Collection Method
status: active
experimental: false
date: 2026-06-10
description: >-
  This value set identifies the technique used to collect a specimen. It
  includes the SNOMED CT 17636008 |Specimen collection (procedure)|
  hierarchy together with additional SNOMED CT concepts that represent
  procedures producing a specimen but are classified outside that
  hierarchy.
copyright: >-
