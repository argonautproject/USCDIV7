  resource:
    - reference:
        reference: AllergyIntolerance/low-criticality
      description: This example of a *US Core AllergyIntolerance Profile* illustrates a confirmed latex contact allergy assessed as low criticality based on a history of mild, localized contact dermatitis without systemic involvement.
