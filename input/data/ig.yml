      description: This extension records modifications, tools, technologies, and other supports necessary to enable a patient or other individual to access care, captured as a free-text annotation. Examples include sign language interpreters, wheelchair accessibility requirements, and sensory accommodation.
      exampleBoolean: false
      name: US Core Accommodation Extension
    - reference:
        reference: StructureDefinition/us-core-allergyintolerance
      description: The US Core AllergyIntolerance Profile inherits from the FHIR [AllergyIntolerance](https://hl7.org/fhir/R4/allergyintolerance.html) resource; refer to it for scope and usage definitions. This profile meets the requirements of the U.S. Core Data for Interoperability (USCDI) *Allergies and Intolerances Data Class* and its *Allergy Intolerance Criticality Data Element*. It sets minimum expectations for the AllergyIntolerance resource to record, search, and fetch allergies and adverse reactions associated with a patient. It specifies which core elements, extensions, vocabularies, and value sets **SHALL** be present in the resource and constrains how the elements are used. Providing the floor for standards development for specific use cases promotes interoperability and adoption.
      exampleBoolean: false
      name: US Core AllergyIntolerance Profile
