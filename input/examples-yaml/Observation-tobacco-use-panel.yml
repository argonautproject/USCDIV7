resourceType: Observation
id: tobacco-use-panel
meta:
  extension:
  - url: http://hl7.org/fhir/StructureDefinition/instance-name
    valueString: Tobacco Use Panel Example
  - url: http://hl7.org/fhir/StructureDefinition/instance-description
    valueMarkdown: This example for the proposed *US Core Tobacco Use Profile* shows
      a single Observation using `component` elements to convey the LOINC 88028-6
      Tobacco use panel members. The patient is a current every day cigarette and
      e-cigarette smoker who also uses smokeless tobacco occasionally, smokes less
      than one pack per day, has used tobacco for ten years, and has a calculated
      cumulative exposure of less than ten pack-years.
  profile:
  - http://hl7.org/fhir/us/core/StructureDefinition/us-core-tobacco-use
