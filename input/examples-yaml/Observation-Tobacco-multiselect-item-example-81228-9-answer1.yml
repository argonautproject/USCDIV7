note:
- text: The type(s) of tobacco used for known tobacco users. Examples include cigarettes, cigars, pipe tobacco and smokeless
    tobacco. This term was created for, but is not limited in use to, the Joint Commission's tobacco treatment eCQM, which
    uses separate OIDs for each recommended answer and associated SNOMED CT code rather than a single OID for the answer list
    as a whole. The answer OIDs that are available as of the date this term was created are specified in the description for
    each answer in the LOINC answer list, and new OIDs will be added as they become available and are reported to the LOINC
    development team.
